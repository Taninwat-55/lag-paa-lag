# The site is the Astro project at the root. studio/ is the Sanity Studio,
# hosted by Sanity (lag-paa-lag.sanity.studio), so Netlify never builds it.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# fingerprinted or never-changing files can be cached for a year
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
